<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFS</title>
    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="src/all.min.css">
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-100">

    <div
        class=" w-[370px] h-[750px] bg-white  border-8 border-black rounded-[55px]"
    >

        <!-- Phone Screen -->
        <div
            class="relative w-full h-full bg-white rounded-[45px]"
        >

            <!-- Top Status Bar -->
            <div
                class="top-0 left-0 w-full h-[45px] flex items-center justify-between px-8 text-[12px] font-medium text-gray-700"
            >
                <span>09:41</span>

                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full text-[15px]"></i>
                </div>
            </div>


            <!-- login Screen -->
            
            <div 
            id="firstscreen"
            class="absolute flex flex-col justify-between text-center mt-50 gap-y-3 rounded-[55px] w-full p-10 hover:shadow-2xl hover:backdrop-blur-2xl duration-300 ">
                <input 
                id="firstScreenName"
                class="w-full border border-gray-300 rounded-md px-4 py-3  uppercase "
                type="text"
                placeholder="Enter your number">
                <input 
                id="firstScreenPassword"
                class="w-full border border-gray-300 rounded-md px-4 py-3 uppercase "
                type="password"
                placeholder="********">
                <p id="firstScreenErrornum" class="py-2 bg-red-200 rounded-md text-center text-red-700 font-bold text-[15px]" hidden>Please enter your number</p>
                <p id="firstScreenErrorPIN" class="p-2 bg-red-200 rounded-md text-center text-red-700 font-bold " hidden>Please enter your PIN</p>
                <button
                id="firstScreenBtn"
                class="w-full  bg-gradient-to-br from-indigo-800 to-black rounded-2xl mt-5 px-5 py-5 font-bold text-xl uppercase text-white">login</button>
            </div>

            <!-- second screen -->  
            <div
            class="p-2"
            id="secondScreen" hidden>
                <div class="bg-gradient-to-br from-indigo-800 to-black rounded-2xl mt-5 px-5 py-5 w-full font-bold text-xl uppercase text-white mt-1">
                    <div class="flex gap-x-4 items-center ">
                        <div class=" bg-white/50 p-2 rounded-2xl items-center"><i class="fa-solid fa-bag-shopping"></i></div><p class="text-gray-400 text-2xl">current balance</p></div>

                        <p class="text-gray-400 text-[15px] mt-10">current amount</p>
                        <p 
                        id="current_amount"
                        class="text-2xl"> 1000</p>
                </div>
                <div class="flex mt-2 justify-between gap-x-2">
                    <!-- add money btn -->
                    <div 
                    id="add_Money_Btn"
                    class="flex flex-col justify-between items-center text-center text-white bg-violet-500 p-5 rounded-2xl w-1/2">
                        <div class=" bg-white/50 p-2 rounded-2xl items-center w-1/3"><i class="fa-solid fa-plus"></i></div>
                        <p>Add money</p>
                    </div>
                    <!-- cash out btn -->
                    <div 
                    id="cash_out_Btn"
                    class="flex flex-col text-black justify-between items-center text-center p-5 rounded-2xl bg-red-500 w-1/2">
                    <div class=" bg-white/50 p-2 rounded-2xl items-center w-1/3"><i class="fa-solid fa-arrow-right-to-bracket"></i></div><p>Cash out</p>
                    </div>
                </div>

                <!-- add money amount -->

                <div id="add_money" class="" hidden>
                        <P 
            class="text-violet-500 text-2xl font-bold mt-5"
            >
            Add money</P>
            <input 
            id="add_money_Input" 
            type="text" 
            placeholder="Enter add money amount" class="w-full mt-2 border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-violet-400 ">


            <button 
            id="add_money_btn"
            class="w-full   bg-violet-500 rounded-2xl mt-2 px-5 py-5 font-bold text-xl text-white">
                Add money
            </button>
                </div>
                
                <!-- cash out amount -->
                <div id="cash_out" class="" hidden >
                        <P 
            class="text-red-500 text-2xl font-bold mt-5"
            >
            cash out</P>
            <input 
            id="cash_out_Input" 
            type="text" 
            placeholder="Enter cashout amonunt" class="w-full mt-2 border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-400 ">


            <button 
            id="cash_out_btn"
            class="w-full   bg-red-500 rounded-2xl mt-2 px-5 py-5 font-bold text-xl text-white">
                cash out
            </button>
                </div>
            </div>
        </div>


    </div>




    <script src="js/script.js"></script>
</body>
</html>
